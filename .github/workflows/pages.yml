name: Validate and deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 -B validate_trips.py
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.test.cjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-regression-samples
          path: test-results/pdf
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public website files
        run: |
          mkdir -p deploy-site/data
          cp index.html travel-mode.js travel-mode.css trip-maintenance.js pdf-book.js pdf-book.css og-image.png .nojekyll deploy-site/
          cp data/trips.js data/maintenance.js deploy-site/data/
          cp -R img deploy-site/img
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy-site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
